  Launch demo modal

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="StepInModal" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="StepInModal">Step IN</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="formGroup">
          <div class="row pt-2">
            <div class="col-lg-12 pb-3">
              <app-form-control inputType="text" [formGroup]="formGroup" inputId="userId" controlName="userId"
                placeholder="Enter user id" label="User ID" [isRequired]="true">
              </app-form-control>
            </div>
            <div class="col-lg-12">
              <app-otp-input (otpCompleted)="verifyOtp($event)"></app-otp-input>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" [disabled]="!isOtpValid">
          Verify OTP
        </button>
        <button type="submit" class="btn btn-warning" (click)="stepIn()">Step In</button>
      </div>
    </div>
  </div>
</div>
