<div [formGroup]="formGroup">
  @if(isLabel) {
  <label [for]="inputId" class="form-label">{{ label }}
    @if(isRequired) {
    <span class="text-danger">* </span>
    }
  </label>
  }
@if (inputType === 'select') {
  <select class="form-select" [class.is-invalid]="control?.invalid && (control?.touched || control?.dirty)"
    [id]="inputId" [formControlName]="controlName" [attr.disabled]="readonly ? '' : null">
    <option value="">{{ placeholder }}</option>
    @for (item of options; track item[valueKey]) {
    <option [value]="item[valueKey]">
      {{ item[labelKey] }}
    </option>
    }
  </select>
}

  @if (inputType === 'text') {
  <input
    type="text"
    class="form-control"
    [id]="inputId"
    [placeholder]="placeholder"
    [formControlName]="controlName"
    [readonly]="readonly"
    [class.is-invalid]="control?.invalid && (control?.touched || control?.dirty)"
  />
}



  @if (control?.invalid && control?.touched) {
  @for (err of control?.errors | keyvalue; track err.key) {
  <!-- <pre>{{ err | json }}</pre> -->
  <div class="text-danger fs-7">
    @if (err.key === 'required') {
    {{ errorMessage[err.key] }}
    }
  </div>
  }
  }



</div>
