<form [formGroup]="formGroup" >
  
<app-form-control
   [formGroup]="formGroup"
    inputId="district"
    controlName="districtId"
    [options]="districts"
    valueKey="districtId"
    labelKey="districtName"
    placeholder="Select District"
    >
  </app-form-control>


  @if(isBrowser && creator) {
  <survey-creator [model]="creator">
  </survey-creator>
  }

  <button class="btn btn-primary mt-3" type="submit" (click)="saveTemplate()">
    Save Survey Template
  </button>

</form>
